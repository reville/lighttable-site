<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Screenshots of the native LightTable digital darkroom for macOS." />
    <meta name="theme-color" content="#242424" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="apple-touch-icon" href="app-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>LightTable screenshots</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="./" aria-label="LightTable home">
        <img src="app-icon-64.png" alt="" width="30" height="30" />
        <span>LightTable</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="screenshots.html" aria-current="page">Screenshots</a>
        <a href="features.html">Features</a>
        <a href="https://github.com/reville/lighttable-digital-darkroom">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </header>

    <main class="gallery-main" id="main">
      <div class="gallery-intro">
        <a class="back-link" href="./">← Back to LightTable</a>
        <h1 class="reveal">LightTable screenshots</h1>
        <p class="gallery-summary reveal">Ten views of the real LightTable interface, each captured with a different photograph from LightTable’s CC0 test collection.</p>
      </div>

      <div class="gallery">
        <figure class="reveal">
          <img
            src="screenshots/film-controls.webp"
            alt="LightTable Film workspace showing a desert landscape with film stock, format, paper, and physical print controls"
            width="1800"
            height="1169"
          />
          <figcaption>
            <strong>Film workspace</strong>
            <span>Stock response, film format, print process, and finishing effects</span>
          </figcaption>
        </figure>

        <figure class="reveal">
          <img
            src="screenshots/editor.webp"
            alt="LightTable Edit workspace showing a harbor ferry with light, curve, and color controls"
            width="1800"
            height="1169"
          />
          <figcaption>
            <strong>Editing workspace</strong>
            <span>Fast, local, non-destructive light and color controls</span>
          </figcaption>
        </figure>

        <figure class="reveal">
          <img
            src="screenshots/crop-and-rotate.webp"
            alt="LightTable Crop and Rotate workspace showing a stone church with an active crop frame and aspect-ratio controls"
            width="1800"
            height="1169"
            loading="lazy"
          />
          <figcaption>
            <strong>Crop &amp; rotate</strong>
            <span>On-image crop handles, aspect ratios, rotation, and reversible framing</span>
          </figcaption>
        </figure>

        <figure class="reveal">
          <img
            src="screenshots/local-masks.webp"
            alt="LightTable Masking workspace showing succulent plants with a radial mask overlay and local adjustment controls"
            width="1800"
            height="1169"
            loading="lazy"
          />
          <figcaption>
            <strong>Local masks</strong>
            <span>Geometric, brush, subject, sky, object, depth, and people-aware selections</span>
          </figcaption>
        </figure>

        <figure class="reveal">
          <img
            src="screenshots/remove.webp"
            alt="LightTable Remove workspace showing a toy still life with editable heal source and target circles"
            width="1800"
            height="1169"
            loading="lazy"
          />
          <figcaption>
            <strong>Remove distractions</strong>
            <span>Remove, heal, and clone corrections stay editable on the photograph</span>
          </figcaption>
        </figure>

        <figure class="reveal">
          <img
            src="screenshots/lens-and-geometry.webp"
            alt="LightTable Lens workspace showing coastal dunes with profile and geometry correction controls"
            width="1800"
            height="1169"
            loading="lazy"
          />
          <figcaption>
            <strong>Lens &amp; geometry</strong>
            <span>Profile correction, auto level, perspective, rotation, and scale</span>
          </figcaption>
        </figure>

        <figure class="reveal">
          <img
            src="screenshots/before-after.webp"
            alt="LightTable split comparison showing the original and edited versions of an autumn leaf photograph"
            width="1800"
            height="1169"
            loading="lazy"
          />
          <figcaption>
            <strong>Original vs. edited</strong>
            <span>A draggable split compares the source with the complete edit</span>
          </figcaption>
        </figure>

        <figure class="reveal">
          <img
            src="screenshots/photo-info.webp"
            alt="LightTable Info workspace showing an aerial castle photograph with rating, keyword, EXIF, and render provenance controls"
            width="1800"
            height="1169"
            loading="lazy"
          />
          <figcaption>
            <strong>Photo info &amp; keywords</strong>
            <span>Ratings, flags, keywords, EXIF, and render provenance in one place</span>
          </figcaption>
        </figure>

        <figure class="reveal">
          <img
            src="screenshots/history.webp"
            alt="LightTable History workspace showing a city tree photograph and its recorded non-destructive adjustment steps"
            width="1800"
            height="1169"
            loading="lazy"
          />
          <figcaption>
            <strong>Non-destructive history</strong>
            <span>Every adjustment is recorded with the photograph and remains reversible</span>
          </figcaption>
        </figure>

        <figure class="reveal">
          <img
            src="screenshots/export-workflow.webp"
            alt="LightTable Export workspace showing a tropical homestead with recipe, format, size, color space, and naming controls"
            width="1800"
            height="1169"
            loading="lazy"
          />
          <figcaption>
            <strong>Full-resolution export</strong>
            <span>Reusable recipes, color spaces, sizing, file naming, and collision handling</span>
          </figcaption>
        </figure>
      </div>
    </main>

    <footer>
      <span>LightTable</span>
      <a class="text-link" href="https://github.com/reville/lighttable-digital-darkroom">View the project on GitHub <span aria-hidden="true">↗</span></a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
