<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Screenshots of the native LightTable digital darkroom for macOS." />
    <meta name="theme-color" content="#0b0c0b" />
    <link rel="icon" href="icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>LightTable screenshots</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="./" aria-label="LightTable home">
        <img src="icon.png" alt="" width="30" height="30" />
        <span>LightTable</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="screenshots.html" aria-current="page">Screenshots</a>
        <a href="./#features">Features</a>
        <a href="https://github.com/reville/lighttable-app">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </header>

    <main class="gallery-main" id="main">
      <div class="gallery-intro">
        <a class="back-link" href="./">← Back to LightTable</a>
        <h1 class="reveal">LightTable screenshots</h1>
      </div>

      <div class="gallery">
        <figure class="reveal">
          <img
            src="screenshots/film-controls.webp"
            alt="LightTable Film workspace with Portra 400, film format, print paper, and physical effect controls"
            width="1800"
            height="1169"
          />
          <figcaption>
            <strong>Film workspace</strong>
            <span>Stock response, film format, print process, and finishing effects</span>
          </figcaption>
        </figure>

        <figure class="reveal">
          <img
            src="screenshots/editor.webp"
            alt="LightTable Edit workspace with exposure, color, detail, and geometry controls"
            width="1800"
            height="1169"
          />
          <figcaption>
            <strong>Editing workspace</strong>
            <span>Fast, local, non-destructive controls in a native macOS interface</span>
          </figcaption>
        </figure>
      </div>
    </main>

    <footer>
      <span>LightTable</span>
      <a class="text-link" href="https://github.com/reville/lighttable-app">View the project on GitHub <span aria-hidden="true">↗</span></a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
